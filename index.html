<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A daily word game. 20 prompts, 30 seconds each, one answer per prompt. Rarer answers score more." />
    <title>Rarely — a daily word game</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4bdb'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='white'%3ER%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to game</a>
    <header class="top">
      <button class="brand" type="button" data-action="home" aria-label="Rarely home">Rarely</button>
      <nav aria-label="Game menu">
        <button type="button" class="ghost" data-action="help">How to play</button>
        <button type="button" class="ghost" data-action="stats">Stats</button>
      </nav>
    </header>
    <div id="banner" class="banner" role="status" hidden></div>
    <main id="main" tabindex="-1"></main>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
